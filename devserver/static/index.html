<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowflix · banco di prova</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66;
    --line: #e3e1db; --accent: #2f5d50; --accent-soft: #e4eeea;
    --warn: #8a5a00; --warn-soft: #fbf1dc; --bad: #9b2c2c; --bad-soft: #f8e5e3;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161716; --panel: #1f201f; --ink: #ecebe6; --muted: #9c9a94;
      --line: #33342f; --accent: #7fb8a6; --accent-soft: #23322d;
      --warn: #e0b562; --warn-soft: #33291a; --bad: #e8908a; --bad-soft: #3a2220;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 24px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: 13px; font-family: var(--mono); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 28px 0 10px; font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }

  #drop { display: block; border: 1.5px dashed var(--line); border-radius: 10px; padding: 34px 18px; text-align: center;
          background: var(--panel); cursor: pointer; transition: border-color .15s, background .15s; }
  #drop:hover, #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop strong { display: block; font-size: 16px; margin-bottom: 4px; }
  #drop span { color: var(--muted); font-size: 13px; }
  #file { display: none; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 12px; }
  button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--accent); background: var(--accent); color: var(--panel); }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .actions span { color: var(--muted); font-size: 13px; }

  .progress { margin-top: 18px; }
  .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar { height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; font-size: 12.5px; }
  .step { color: var(--muted); }
  .step b { font-family: var(--mono); font-weight: 600; margin-right: 4px; }
  .step.on { color: var(--ink); }
  .status { margin-top: 12px; font-size: 13.5px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  .scroll { overflow-x: auto; }
  .num { font-family: var(--mono); text-align: right; white-space: nowrap; }
  .tag { display: inline-block; font-family: var(--mono); font-size: 12px; padding: 1px 7px; border-radius: 4px;
         background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .tag.dim { background: var(--line); color: var(--muted); }
  .evidence { font-size: 13px; color: var(--muted); font-style: italic; }

  .one-liner { font-size: 18px; line-height: 1.4; margin: 0 0 12px; }
  .abstract { margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 600; font-family: var(--mono); }

  .error { border-color: var(--bad); background: var(--bad-soft); }
  .error.retry { border-color: var(--warn); background: var(--warn-soft); }
  .error h3 { margin: 0 0 6px; font-size: 16px; font-family: var(--mono); }
  .error p { margin: 0 0 6px; }
  .error pre { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; margin: 8px 0 0; }

  details { margin-top: 28px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre.raw { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
            font-size: 12.5px; overflow: auto; max-height: 480px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Knowflix · banco di prova</h1>
    <span class="meta" id="info">connessione al server…</span>
  </header>

  <label id="drop" for="file">
    <strong>Trascina qui un documento o fai clic per sceglierlo</strong>
    <span>PDF di tesi o paper, oppure JSON già segmentato (es. fixtures/doc_test.json)</span>
  </label>
  <input id="file" type="file" accept=".pdf,.json,application/pdf,application/json">
  <div class="actions">
    <button type="button" data-sample="tesi_esempio.pdf">Prova con la tesi di esempio (PDF)</button>
    <button type="button" class="ghost" data-sample="doc_test.json">Prova con il fixture JSON</button>
    <span>Lo stesso documento caricato due volte arriva dalla cache.</span>
  </div>

  <section id="run" hidden>
    <div class="progress panel">
      <div class="track"><div class="bar" id="bar"></div></div>
      <div class="steps">
        <div class="step" data-p="0"><b>0</b>avvio</div>
        <div class="step" data-p="33"><b>33</b>sintesi</div>
        <div class="step" data-p="66"><b>66</b>competenze</div>
        <div class="step" data-p="100"><b>100</b>revisione</div>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div id="sections-wrap" hidden>
      <h2>Sezioni trovate</h2>
      <div class="panel scroll"><table id="sections"></table></div>
      <p class="note" id="sections-note"></p>
    </div>

    <div id="out"></div>

    <details id="raw-wrap" hidden>
      <summary>JSON grezzo restituito dal Flow</summary>
      <pre class="raw" id="raw"></pre>
    </details>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let info = {}, pollTimer = null;

fetch("/api/info").then(r => r.json()).then(d => {
  info = d;
  $("info").textContent = `motore ${d.engine_version} · tassonomia ${d.taxonomy_version} · ${d.model} · TLS ${d.tls_store}`;
}).catch(() => { $("info").textContent = "server non raggiungibile"; });

const drop = $("drop");
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => ev.dataTransfer.files[0] && upload(ev.dataTransfer.files[0]));
$("file").addEventListener("change", ev => ev.target.files[0] && upload(ev.target.files[0]));
document.querySelectorAll("[data-sample]").forEach(b => b.addEventListener("click", async () => {
  const name = b.dataset.sample;
  try {
    const r = await fetch(`/samples/${name}`);
    if (!r.ok) throw new Error(`${name} non trovato sul server`);
    const blob = await r.blob();
    upload(new File([blob], name, {type: blob.type}));
  } catch (e) {
    $("run").hidden = false;
    $("status").textContent = e.message;
  }
}));
// link diretto: /?sample=tesi_esempio.pdf avvia subito l'esempio
const autoSample = new URLSearchParams(location.search).get("sample");
if (autoSample) document.querySelector(`[data-sample="${CSS.escape(autoSample)}"]`)?.click();

async function upload(file) {
  clearTimeout(pollTimer);
  $("run").hidden = false;
  $("out").innerHTML = "";
  $("raw-wrap").hidden = true;
  $("sections-wrap").hidden = true;
  setProgress(null);
  $("status").textContent = `Invio di ${file.name}…`;
  try {
    const r = await fetch(`/api/jobs?filename=${encodeURIComponent(file.name)}`, {
      method: "POST", body: file,
      headers: {"Content-Type": file.type || "application/octet-stream"},
    });
    const job = await r.json();
    if (!r.ok) throw new Error(job.detail || r.statusText);
    render(job);
  } catch (e) {
    $("status").textContent = `Errore di invio: ${e.message}`;
  }
  $("file").value = "";
}

async function poll(id) {
  try {
    const r = await fetch(`/api/jobs/${id}`);
    render(await r.json());
  } catch (e) {
    $("status").textContent = "Server non raggiungibile, riprovo…";
    pollTimer = setTimeout(() => poll(id), 2000);
  }
}

function setProgress(p) {
  $("bar").style.width = (p ?? 0) + "%";
  document.querySelectorAll(".step").forEach(s => s.classList.toggle("on", p !== null && +s.dataset.p <= p));
}

function render(job) {
  setProgress(job.progress);
  renderSections(job.sections || []);
  const t = job.seconds != null ? ` in ${job.seconds}s` : "";
  if (job.status === "queued") {
    $("status").textContent = job.queue_position ? `In coda (${job.queue_position} job prima di questo)…` : "In coda…";
  } else if (job.status === "running") {
    const phase = {null: "avvio", 0: "sintesi in corso", 33: "estrazione competenze in corso",
                   66: "revisione in corso", 100: "collegamento alla tassonomia"}[job.progress];
    $("status").textContent = `${job.doc_id}: ${phase}…`;
  } else if (job.status === "done") {
    $("status").textContent = `${job.doc_id}: completato${t}${job.cached ? " (dalla cache)" : ""}.`;
  } else {
    $("status").textContent = `${job.doc_id}: fallito${t}.`;
  }
  if (job.status === "queued" || job.status === "running") {
    pollTimer = setTimeout(() => poll(job.id), 1000);
    return;
  }
  $("out").innerHTML = job.error ? renderError(job.error) : renderProfile(job.result);
  $("raw").textContent = JSON.stringify(job.error ? {error: job.error} : job.result, null, 2);
  $("raw-wrap").hidden = false;
}

function renderSections(sections) {
  if (!sections.length) return;
  $("sections-wrap").hidden = false;
  $("sections").innerHTML = "<tr><th>kind</th><th>titolo</th><th class='num'>caratteri</th><th>uso</th></tr>" +
    sections.map(s => `<tr><td><span class="tag ${s.use === "ignorata" ? "dim" : ""}">${esc(s.kind)}</span></td>
      <td>${esc(s.heading || "—")}</td><td class="num">${s.chars.toLocaleString("it")}</td><td>${esc(s.use)}</td></tr>`).join("");
  const skillChars = sections.filter(s => s.use === "competenze").reduce((a, s) => a + s.chars, 0);
  $("sections-note").textContent = skillChars ? "" :
    "Nessun testo in methodology/results/discussion: il motore non potrà estrarre competenze.";
}

function renderError(err) {
  const hint = {
    rate_limited: "Quota del provider esaurita. Riprova più tardi.",
    provider_unavailable: "Il provider LLM non risponde o è sovraccarico. Riprova più tardi.",
    timeout: "Il provider non ha risposto in tempo. Riprova più tardi.",
    unauthorized: "Controlla la chiave API nel file .env.",
    invalid_payload: "Il documento non rispetta il formato atteso.",
    unsupported_payload_version: "parser_version non supportata da questo motore.",
    empty_content: "Il documento non contiene testo nelle sezioni usate dal motore.",
    internal_error: "Errore interno del motore.",
  }[err.code] || "";
  return `<h2>Errore</h2>
    <div class="panel error ${err.retryable ? "retry" : ""}">
      <h3>${esc(err.code)} · retryable: ${err.retryable}</h3>
      <p>${esc(hint)}</p>
      <pre>${esc(err.message)}</pre>
    </div>`;
}

function renderProfile(p) {
  const skills = p.skills || [];
  const linked = skills.filter(s => s.skill_id).length;
  const cov = p.taxonomy_coverage == null ? "—" : Math.round(p.taxonomy_coverage * 100) + "%";
  return `
    <h2>Sintesi</h2>
    <div class="panel">
      <p class="one-liner">${esc(p.one_liner)}</p>
      <p class="abstract">${esc(p.abstract_150)}</p>
      <div class="chips">${(p.keywords || []).map(k => `<span class="chip">${esc(k)}</span>`).join("")}</div>
    </div>

    <h2>In breve</h2>
    <div class="stats">
      <div class="stat"><div class="k">competenze</div><div class="v">${skills.length}</div></div>
      <div class="stat"><div class="k">in tassonomia</div><div class="v">${linked}</div></div>
      <div class="stat"><div class="k">copertura tassonomia</div><div class="v">${cov}</div></div>
      <div class="stat"><div class="k">scartate dal reviewer</div><div class="v">${(p.rejected || []).length}</div></div>
    </div>

    <h2>Competenze</h2>
    ${skills.length ? `<div class="panel scroll"><table>
      <tr><th>competenza</th><th>sezione</th><th>tassonomia</th><th class="num">conf.</th></tr>
      ${skills.map(s => `
        <tr><td><strong>${esc(s.label)}</strong><div class="evidence">“${esc(s.evidence)}”</div></td>
          <td><span class="tag">${esc(s.section_kind)}</span></td>
          <td>${s.skill_id ? `<span class="tag">${esc(s.skill_id)}</span>` : `<span class="tag dim">null</span>`}</td>
          <td class="num">${Number(s.confidence).toFixed(2)}</td></tr>`).join("")}
    </table></div>` : `<div class="panel">Nessuna competenza estratta.</div>`}

    ${(p.rejected || []).length ? `<h2>Scartate dal reviewer</h2>
      <div class="panel"><ul>${p.rejected.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>` : ""}

    ${p.review_notes ? `<h2>Note del reviewer</h2><div class="panel">${esc(p.review_notes)}</div>` : ""}
    <p class="note">cover_figure_id: ${esc(p.cover_figure_id ?? "null")} · public_card.abstract: non popolato in questa versione</p>`;
}
</script>
</body>
</html>
